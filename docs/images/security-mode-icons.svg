<svg xmlns="http://www.w3.org/2000/svg" width="768" height="275.2" viewBox="0 0 1200 430" role="img" aria-labelledby="title description">
  <title id="title">Vault in Vault ribbon security modes</title>
  <desc id="description">Manual lock, password auto-clear, and automatic idle lock icons, followed by the three password status colors.</desc>
  <rect width="1200" height="430" rx="28" fill="#ffffff"/>
  <text x="60" y="58" fill="#262626" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="700">Ribbon security modes</text>

  <g transform="translate(42 88)">
    <rect width="340" height="220" rx="24" fill="#f7f7f8"/>
    <g transform="translate(134 34) scale(3)" fill="none" stroke="#292929" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect width="18" height="12" x="3" y="10" rx="2"/>
      <path d="M7 10V7a5 5 0 0 1 10 0v3"/>
      <circle cx="12" cy="16" r="1"/>
    </g>
    <text x="170" y="147" text-anchor="middle" fill="#262626" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="650">Manual lock</text>
    <text x="170" y="183" text-anchor="middle" fill="#686868" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">Both timers are off</text>
  </g>

  <g transform="translate(430 88)">
    <rect width="340" height="220" rx="24" fill="#f7f7f8"/>
    <g transform="translate(126 34) scale(3)" fill="none" stroke="#292929" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3.172a2 2 0 0 0 1.414-.586l8.704-8.704a6.5 6.5 0 1 0-5-5z"/>
      <circle cx="16.5" cy="7.5" r=".5" fill="#292929"/>
    </g>
    <g transform="translate(194 26) scale(1.15)" fill="#ffffff" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <path d="M12 6v6h4"/>
    </g>
    <text x="170" y="147" text-anchor="middle" fill="#262626" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="650">Password auto-clear</text>
    <text x="170" y="183" text-anchor="middle" fill="#686868" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">Key + clock badge</text>
  </g>

  <g transform="translate(818 88)">
    <rect width="340" height="220" rx="24" fill="#f7f7f8"/>
    <g transform="translate(126 34) scale(3)" fill="none" stroke="#292929" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect width="18" height="12" x="3" y="10" rx="2"/>
      <path d="M7 10V7a5 5 0 0 1 10 0v3"/>
      <circle cx="12" cy="16" r="1"/>
    </g>
    <g transform="translate(194 26) scale(1.15)" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12a9 9 0 0 0-15-6.7L3 8"/>
      <path d="M3 3v5h5"/>
      <path d="M3 12a9 9 0 0 0 15 6.7L21 16"/>
      <path d="M16 16h5v5"/>
    </g>
    <text x="170" y="147" text-anchor="middle" fill="#262626" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="650">Automatic idle lock</text>
    <text x="170" y="183" text-anchor="middle" fill="#686868" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">Lock + circular-arrow badge</text>
  </g>

  <g transform="translate(60 358)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" fill="#4d4d4d">
    <rect x="0" y="-10" width="34" height="8" rx="4" fill="#e5484d"/>
    <text x="48" y="0">Password unavailable</text>
    <rect x="353" y="-10" width="34" height="8" rx="4" fill="#30a46c"/>
    <text x="401" y="0">Password cached</text>
    <rect x="674" y="-10" width="34" height="8" rx="4" fill="#f5a623"/>
    <text x="722" y="0">Timer ending soon</text>
  </g>
</svg>
